<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>マイ ToDo アプリ</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <aside class="sidebar">

        <div>
            <h1>To Do</h1>

            <ul class="sidebar-menu">
            <li id="menuAll" class="active">すべてのタスク</li>
            <li id="menuActive">未完了タスク</li>
            <li id="menuCompleted">完了したタスク</li>
            </ul>

        </div>

        <div class="version">
            Version 1.0.0
        </div>

    </aside>

    <main class="main-content">

        <div class="input-area">

            <input type="text" id="todo-input" placeholder="新しいタスクを入力...">
            <input type="date" id="todo-date">
            <button id="add-todo-btn" type="button">確定</button>
        </div>

       <div class="todo-wrapper">

            <!-- タスクリストの項目名 -->
            <div class="todo-header">
                <div class="header-task">タスク</div>
                <div class="header-date">期限</div>
                <div class="header-time">入力日時</div>
                <div class="header-edit">編集</div>
                <div class="header-delete">削除</div>
            </div>

            <ul id="todo-list"></ul>

            <button id="clear-completed-btn" 
                    class="clear-btn" 
                    onclick="clearCompletedTodos()" style="display: none;">
                    全削除
            </button>

        </div> 

    </main>

        <script src="script.js"></script>

</body>
</html>
